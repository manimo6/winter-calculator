<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>겨울특강 수강료 계산기</title>
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

  <!-- ✅ CSS 즉시 로드 (잔상 방지용) -->
  <link rel="preload" as="style" href="style.css?v=20251014">
  <link rel="stylesheet" href="style.css?v=20251014">

  <style>
    /* ✅ body 잔상 제거용 트릭 */
    body { 
      opacity: 0; 
      transition: opacity 0.35s ease-in-out;
    }
  </style>
</head>
<body>
  
  <div id="headerContainer">
    <h2 id="mainTitle">2025 겨울특강 수강료 계산기</h2>
    <div id="linkBox" style="position: static;">
      <button id="linkBtn" type="button" data-href="https://manimo6.github.io/fall-calculator/">가을학기</button>
    </div>
  </div>
  
  <div id="patchBox">
    <button id="patchBtn" type="button">패치내역</button>
  </div>
  <div id="patchModal">
    <div class="modal-content">
      <button id="closePatchModal">×</button>
      <h3>패치내역 ver 1.0.0</h3>
      <ul>
        <li><b><span style="color:red">계산기는 실수를 할 수 있습니다. <br>중요한 정보는 재차 확인해주세요</span></b></li>
        <li><b><span style="color:green">개선사항 및 버그는 정하민 주임에게 보고</span></b></li>
        <li>-------------------------------------------------------</li>
        <li>2025-10-14: 2025 겨울특강 수강료 계산기 출시</li>
      </ul>
    </div>
  </div>

  <form id="tuitionForm" autocomplete="off" style="position:relative;">
    <div class="form-group">
      <label for="studentName">학생 이름</label>
      <input type="text" id="studentName" required placeholder="이름 입력">
      
      <!-- ✅ 녹화강의 토글 (우측 상단) -->
      <div class="recording-toggle-container">
        <span class="recording-label">녹화강의</span>
        <label class="switch">
          <input type="checkbox" id="recordingToggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>
    
    <div class="form-group" style="position:relative;z-index:120;" id="courseGroup">
      <label for="courseSelectorBtn">수강 과목</label>
      <input type="button" id="courseSelectorBtn" value="과목을 선택하세요" readonly>
      <span id="selectedCourseLabel"></span>
      <div id="courseTreeMenuWrap">
        <input type="text" id="courseSearchBox" placeholder="과목 검색">
        <nav id="courseTreeMenu"></nav>
      </div>
      <select id="course" style="display:none"></select>
    </div>

    <div id="APCourseMultiselect" style="display:none;">
      <div id="APCourseItemsContainer"></div>
      <div class="form-group" style="margin-top: 15px; margin-bottom: 5px;">
        <button type="button" id="addAPCourseBtn">AP 과목 추가</button>
      </div>
    </div>
    
    <div id="singleCourseOptions">
      <div class="form-group" id="startDateGroup">
        <label for="startDate">수강 시작일</label>
        <input type="text" id="startDate" required autocomplete="off" placeholder="날짜 선택">
      </div>
      <div id="extraOptions"></div>
      <div class="form-group duration">
        <label id="durationLabel" for="duration">수강 기간</label>
        <select id="duration" required></select>
      </div>
      
      <!-- ✅ 녹화강의 달력 (토글 ON 시 표시) -->
      <div id="recordingCalendarSection" class="form-group" style="display:none;">
        <label for="recordingCalendar">녹화 수강일</label>
        <div id="recordingCalendarWrap">
          <div id="recordingCalendar"></div>
          <div id="selectedRecordingDates"></div>
        </div>
      </div>
    </div>
    
    <div class="form-group discount" id="discountGroup">
        <label for="discount">할인율</label>
        <select id="discount" required>
          <option value="0">0%</option>
          <option value="0.05">5%</option>
          <option value="0.10">10%</option>
          <option value="0.15">15%</option>
          <option value="0.20">20%</option>
          <option value="0.25">25%</option>
        </select>
    </div>
    
    <button type="button" onclick="calculateTuition()">계산하기</button>
  </form>
  
  <div id="resultsContainer" style="display:none;"></div>
  
  <button id="copyButton" onclick="copyReservationInfo()" style="display:none;">복사</button>
  <div id="toast"></div>

  <!-- 외부 라이브러리 -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/i18n/jquery-ui-i18n.min.js"></script>

  <!-- ✅ JS 자동 캐시 무효화 (순차 로드 + 잔상 제거 완화 포함) -->
  <script>
    (function() {
const version = Date.now();
      const loadScript = (src, callback) => {
        const s = document.createElement('script');
        s.src = `${src}?v=${version}`;
        s.onload = callback;
        document.body.appendChild(s);
      };

      loadScript('data.js', () => {
        loadScript('calculator_UI_UX.js', () => {
          document.body.style.opacity = 1;
        });
      });

      const metas = [
        { httpEquiv: 'Cache-Control', content: 'no-cache, no-store, must-revalidate' },
        { httpEquiv: 'Pragma', content: 'no-cache' },
        { httpEquiv: 'Expires', content: '0' }
      ];
      metas.forEach(m => {
        const meta = document.createElement('meta');
        meta.httpEquiv = m.httpEquiv;
        meta.content = m.content;
        document.head.appendChild(meta);
      });
    })();
  </script>
</body>
</html>
